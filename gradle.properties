# Gradle 运行参数
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AGP 9 默认值翻转说明（不显式覆盖，走 AGP 9.1.1 默认）：
#   android.newDsl=true          —— 启用新公共 DSL，kotlinOptions 等旧 API 已移除
#   android.builtInKotlin=true   —— 内建 Kotlin，不再需要 org.jetbrains.kotlin.android 插件
#   android.useAndroidX=true     —— 默认已是 true，此处保留显式声明便于阅读
android.useAndroidX=true
android.nonTransitiveRClass=true
