plugins {
    alias(libs.plugins.android.application)
    // AGP 9 内建 Kotlin 支持，不再 apply org.jetbrains.kotlin.android（与新 DSL 不兼容）
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.zimky.coregateUS'
    compileSdk 37

    defaultConfig {
        applicationId "com.zimky.coregateUS"
        // minSdk 33：miuix-blur-android:0.9.4 的 AAR 清单声明 minSdk 33。
        // 本项目面向骁龙 8 Gen 5 一代（Android 16/17、内核 6.6~6.12），
        // 且运行依赖 KernelSU，实际设备全部在 API 33 以上，故直接对齐到 33，
        // 不用 tools:overrideLibrary 绕过检查（绕过会失去构建期保护）。
        minSdk 33
        targetSdk 37
        versionCode 224
        versionName "2.2.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            // libxposed 官方写法：把 resources/META-INF/xposed/* 合并进 APK。
            // 关键：AGP 的 excludes 优先级高于 merges —— 之前这里漏了一条
            //       excludes += '**'，把整个 resources 全排掉，导致
            //       META-INF/xposed/ 三件套（java_init.list / module.prop / scope.list）
            //       永远进不了 APK，LSPosed 识别不到模块、只能逐个弹「请求 hook」窗口。
            // 这里只排掉签名/许可这类无用条目，绝不能用 '**'。
            merges += 'META-INF/xposed/*'
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// AGP 9 新 DSL 下 kotlinOptions 已移除，改用 Kotlin 扩展的 compilerOptions
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.kotlinx.coroutines.android

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    debugImplementation libs.androidx.compose.ui.tooling
    implementation libs.androidx.compose.ui.tooling.preview

    implementation libs.miuix.ui
    implementation libs.miuix.icons
    implementation libs.miuix.nav
    implementation libs.miuix.preference
    implementation libs.miuix.blur

    implementation libs.material.kolor

    // libxposed：运行时由 Xposed 框架提供，绝不能打进 APK（打进会与框架自身类冲突）。
    // 官方 README 的模块开发者写法只有这一条：
    //   compileOnly("io.github.libxposed:api:102.0.0")
    // service 是给「写 Xposed 框架本身」的人用的（framework developers 用 implementation），
    // 模块侧不引用它的任何类。之前多挂一条 service 是噪音，已删除。
    compileOnly libs.libxposed.api
}