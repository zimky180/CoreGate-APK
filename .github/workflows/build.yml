name: CoreGate v2.3.3 animation settings
on:
  push:
    branches: [ci-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK
        run: |
          sdkmanager "platform-tools" "build-tools;36.0.0"
          sdkmanager "platforms;android-37.2" || sdkmanager "platforms;android-37.1" || sdkmanager "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Build test APK
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace --console=plain
      - name: Prepare test APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/CoreGate-v2.3.3-debug.apk
          cp app/build/outputs/apk/release/*-unsigned.apk out/CoreGate-v2.3.3-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CoreGate-v2.3.3-release-unsigned
          path: out/*-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CoreGate-v2.3.3-debug
          path: out/CoreGate-v2.3.3-debug.apk
          if-no-files-found: error
