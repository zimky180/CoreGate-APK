name: Build CoreGate APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (accept licenses & install platform)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager -> $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Rename APK
        run: |
          mkdir -p out
          cp "${{ steps.apk.outputs.path }}" "out/CoreGate-APK-debug-v2.1.0.apk"
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreGate-APK-debug-v2.1.0
          path: out/CoreGate-APK-debug-v2.1.0.apk
          if-no-files-found: error