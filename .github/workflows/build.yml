name: System particle intro test
on:
  push:
    branches: [ci-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          sdkmanager "platform-tools" "build-tools;36.0.0"
          sdkmanager "platforms;android-37.2" || sdkmanager "platforms;android-37.1" || sdkmanager "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Build test APK
        run: gradle assembleRelease --no-daemon --stacktrace --console=plain
      - name: Prepare test APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*-unsigned.apk out/CoreGate-system-particles-test-v2.3.1-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CoreGate-system-particles-test-v2.3.1-unsigned
          path: out/*.apk
          if-no-files-found: error
