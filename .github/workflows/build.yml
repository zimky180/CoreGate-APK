name: Build CoreGate APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager -> $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "build-tools;36.0.0" || true
          "$SM" "platforms;android-37.2" \
            || "$SM" "platforms;android-37.1" \
            || "$SM" "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      # 构建输出落盘。失败时提炼错误为 ::error:: 注解 + step summary，
      # 并通过 issue 评论回传完整日志。
      - name: Build debug APK
        shell: bash
        env:
          GH_LOG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-logs
          gradle assembleDebug --no-daemon --stacktrace --console=plain \
            > ci-logs/gradle-build.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "gradle assembleDebug OK"
            tail -n 40 ci-logs/gradle-build.log
            exit 0
          fi
          echo "===== gradle 退出码 $rc ====="
          tail -n 200 ci-logs/gradle-build.log
          echo "===== 提炼错误要点 ====="
          python3 .github/scripts/ci_extract_errors.py ci-logs/gradle-build.log || true
          echo "$rc" > ci-logs/exit-code.txt
          echo "===== 回传日志到 issue ====="
          GITHUB_TOKEN="$GH_LOG_TOKEN" \
            python3 .github/scripts/report_log_to_issue.py ci-logs/gradle-build.log || true
          exit $rc

      # 关键闸门：packaging.merges 一旦漏配，APK 里就没有 META-INF/xposed/*，
      # LSPosed 列表里本模块会「根本不出现」且没有任何报错。
      - name: Verify Xposed metadata in APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Checking: $APK"
          LIST=$(unzip -l "$APK" | grep "META-INF/xposed/" || true)
          echo "$LIST"
          for f in java_init.list module.prop scope.list; do
            if ! echo "$LIST" | grep -q "META-INF/xposed/$f"; then
              echo "::error::APK 缺少 META-INF/xposed/$f —— 检查 app/build.gradle 的 packaging.merges"
              exit 1
            fi
          done
          echo "xposed metadata OK"

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"
          ls -l "$APK"

      - name: Rename APK
        run: |
          mkdir -p out
          cp "${{ steps.apk.outputs.path }}" "out/CoreGate-APK-debug-v2.2.2.apk"
          ls -l out

      - name: Upload gradle log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ci-logs/
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreGate-APK-debug-v2.2.2
          path: out/CoreGate-APK-debug-v2.2.2.apk
          if-no-files-found: error