name: Build CoreGate APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager -> $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "build-tools;36.0.0" || true
          "$SM" "platforms;android-37.2" \
            || "$SM" "platforms;android-37.1" \
            || "$SM" "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Build debug APK
        shell: bash
        continue-on-error: true
        env:
          GH_LOG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-logs
          set +e
          gradle assembleDebug --no-daemon --stacktrace --console=plain > ci-logs/gradle-build.log 2>&1
          rc=$?
          echo "gradle exit code = [$rc]"
          echo "$rc" > ci-logs/exit-code.txt
          echo "--- log size: $(wc -c < ci-logs/gradle-build.log) bytes ---"
          tail -n 200 ci-logs/gradle-build.log
          python3 .github/scripts/ci_extract_errors.py ci-logs/gradle-build.log || echo "extract script failed"
          exit 0

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ci-logs/
          if-no-files-found: warn

      - name: Publish log to issue
        if: always()
        shell: bash
        env:
          GH_LOG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RUN: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [ -f ci-logs/gradle-build.log ]; then
            GITHUB_TOKEN="$GH_LOG_TOKEN" python3 .github/scripts/report_log_to_issue.py ci-logs/gradle-build.log || echo "issue report failed"
          else
            echo "no log file"
          fi

      - name: Fail if gradle failed
        shell: bash
        run: |
          rc=$(cat ci-logs/exit-code.txt 2>/dev/null || echo 99)
          echo "gradle rc = $rc"
          if [ "$rc" != "0" ]; then exit 1; fi

      - name: Verify Xposed metadata in APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Checking: $APK"
          LIST=$(unzip -l "$APK" | grep "META-INF/xposed/" || true)
          echo "$LIST"
          for f in java_init.list module.prop scope.list; do
            if ! echo "$LIST" | grep -q "META-INF/xposed/$f"; then
              echo "::error::APK 缺少 META-INF/xposed/$f —— 检查 app/build.gradle 的 packaging.merges"
              exit 1
            fi
          done
          echo "xposed metadata OK"

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          mkdir -p out
          cp "$APK" "out/CoreGate-APK-debug-v2.2.2.apk"
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreGate-APK-debug-v2.2.2
          path: out/CoreGate-APK-debug-v2.2.2.apk
          if-no-files-found: error


      - name: Upload APK to Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          TAG=v2.2.2
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" -t "CoreGate APK $TAG" -n "CI build"
          gh release upload "$TAG" out/CoreGate-APK-debug-v2.2.2.apk --clobber
          echo "release upload done"
          exit 0
